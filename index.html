<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Daily Blessings</title>
<meta name="description" content="A blessing from Scripture every morning." />
<meta name="theme-color" content="#c9a227" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Blessings" />
<link rel="manifest" href="./manifest.json" />

<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #fffdf7;
    --ink: #241f18;
    --muted: #8a8175;
    --gold: #c9a227;
    --gold-deep: #96751c;
    --gold-pale: #f7ecc9;
    --line: #f0e7d2;
    --heart: #b4493a;
    --radius: 24px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: clamp(14px, 4vw, 40px);
    background: var(--bg);
    background-image:
      radial-gradient(820px 460px at 50% -6%, #fff9e8 0%, rgba(255,249,232,0) 68%),
      radial-gradient(560px 400px at 108% 104%, #fdf4dd 0%, rgba(253,244,221,0) 72%);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 660px;
    padding: clamp(26px, 5vw, 48px);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow:
      0 24px 56px -34px rgba(120, 96, 30, .38),
      0 2px 10px -6px rgba(120, 96, 30, .14);
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 3px;
    border-radius: var(--radius) var(--radius) 0 0;
    background: linear-gradient(90deg, transparent, var(--gold), var(--gold-pale), var(--gold), transparent);
  }

  /* ---------- Header ---------- */
  .head { text-align: center; margin-bottom: clamp(20px, 4vw, 30px); }

  .ornament {
    display: block;
    margin: 0 auto 14px;
    color: var(--gold);
    opacity: .9;
  }

  .greeting {
    margin: 0;
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    font-size: clamp(1.14rem, 1rem + .55vw, 1.42rem);
    color: var(--ink);
    letter-spacing: .01em;
  }

  .date {
    margin: 8px 0 0;
    font-size: .7rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--gold-deep);
  }

  /* ---------- Verse ---------- */
  .verse { margin: 0; padding: 0; text-align: center; }

  .verse-text {
    margin: 0 0 18px;
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    font-size: clamp(1.1rem, 1rem + .9vw, 1.44rem);
    line-height: 1.7;
    color: var(--ink);
    text-wrap: pretty;
  }

  .verse-ref {
    display: block;
    font-style: normal;
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--gold-deep);
  }

  .rule {
    width: 52px;
    height: 1px;
    margin: 22px auto;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: .7;
  }

  .prayer {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: .94rem;
    line-height: 1.62;
    color: var(--muted);
    text-wrap: pretty;
  }

  .verse.swap { animation: rise .45s cubic-bezier(.2, .7, .3, 1) both; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(9px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- Actions ---------- */
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: clamp(26px, 4vw, 34px);
    padding-top: 22px;
    border-top: 1px solid var(--line);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 18px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: .86rem;
    cursor: pointer;
    transition: background .2s, border-color .2s, color .2s, transform .12s;
  }
  .btn:hover { background: var(--bg-soft); border-color: #e3d4ac; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { cursor: default; opacity: .7; }

  .btn-primary {
    background: linear-gradient(180deg, #f3d97f, #ddb747);
    border-color: #d4ac39;
    color: #2a2418;
    font-weight: 600;
    box-shadow: 0 6px 16px -10px rgba(180, 145, 30, .9);
  }
  .btn-primary:hover { background: linear-gradient(180deg, #f7e296, #e3c052); }

  .btn-icon { width: 44px; height: 44px; padding: 0; flex: 0 0 auto; }
  .btn-icon.is-on { color: var(--heart); border-color: #eed3ca; background: #fff8f6; }

  :where(.btn, .link-btn):focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
    border-radius: 999px;
  }

  /* ---------- Footer ---------- */
  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-top: 20px;
    min-height: 20px;
    flex-wrap: wrap;
  }

  .link-btn {
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    font-size: .78rem;
    color: var(--muted);
    cursor: pointer;
    text-decoration: underline;
    text-decoration-color: rgba(138, 129, 117, .35);
    text-underline-offset: 3px;
  }
  .link-btn:hover { color: var(--gold-deep); }

  .progress { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); opacity: .75; }

  .signature {
    margin: 22px 0 0;
    text-align: center;
    font-size: .72rem;
    letter-spacing: .1em;
    color: var(--gold-deep);
    opacity: .8;
  }

  /* ---------- Dialog ---------- */
  dialog {
    width: min(560px, calc(100vw - 32px));
    max-height: min(82vh, 760px);
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: #fff;
    color: var(--ink);
    box-shadow: 0 34px 70px -22px rgba(90, 72, 20, .45);
  }
  dialog[open] { display: flex; flex-direction: column; }
  dialog::backdrop { background: rgba(60, 48, 20, .38); backdrop-filter: blur(3px); }

  .dialog-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--line);
  }
  .dialog-head h2 {
    margin: 0; font-family: Georgia, serif; font-size: 1.06rem; font-weight: normal;
  }

  .dialog-body { overflow-y: auto; padding: 6px 22px 22px; }
  #savedList { list-style: none; margin: 0; padding: 0; }

  .saved-item { padding: 18px 0; border-bottom: 1px solid var(--line); }
  .saved-item:last-child { border-bottom: 0; }

  .saved-text {
    margin: 0 0 10px;
    font-family: Georgia, serif;
    font-size: .95rem;
    line-height: 1.62;
  }
  .saved-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .saved-ref {
    font-style: normal; font-size: .68rem; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase; color: var(--gold-deep);
  }
  .saved-remove {
    padding: 0; border: 0; background: none; font: inherit; font-size: .74rem;
    color: var(--muted); cursor: pointer; text-decoration: underline;
    text-decoration-color: rgba(138, 129, 117, .35); text-underline-offset: 3px;
  }
  .saved-remove:hover { color: var(--heart); }

  .empty { padding: 32px 0; text-align: center; color: var(--muted); font-size: .88rem; }

  @media (max-width: 430px) {
    .actions .btn-primary { flex: 1 1 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>

<main class="card">
  <header class="head">

      </svg>

    <button class="btn" id="copyBtn" type="button">

      </svg>
    </button>
  </div>

  <footer class="foot">
    <button class="link-btn" id="savedBtn" type="button">
      Saved verses <span id="savedCount"></span>
    </button>
    <button class="link-btn" id="dailyBtn" type="button" hidden>Back to today</button>
    <span class="progress" id="progress"></span>
  </footer>

  <p class="signature" id="signature" hidden></p>
</main>

<dialog id="savedDialog" aria-labelledby="savedTitle">
  <div class="dialog-head">
    <h2 id="savedTitle">Saved verses</h2>
    <button class="btn btn-icon" id="closeDialog" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>
  </div>
  <div class="dialog-body"><ul id="savedList"></ul></div>
</dialog>

const VERSES = RAW_VERSES.map((row) => {
  const i = row.indexOf("|");
  return { ref: row.slice(0, i), text: row.slice(i + 1) };
});

/* =========================================================
   3. PRAYER LINES — one is paired with each day
   ========================================================= */
const PRAYERS = [
  "Lord, thank You for this new morning. Walk with me through it.",
  "Father, let Your favour go before me today.",
  "Lord, make me a blessing to someone before this day ends.",
  "Father, quiet my heart and let Your peace settle here.",
  "Lord, strengthen me for what lies ahead, and keep me faithful.",
  "Father, thank You for mercies that are new every morning.",
  "Lord, let Your light shine through me today.",
  "Father, I trust You with the things I cannot see.",
  "Lord, keep my feet on the path You have chosen.",
  "Father, let my words today be seasoned with grace.",
  "Lord, thank You for the people You have placed in my life.",
  "Father, give me eyes to see the good You are doing.",
  "Lord, be my strength when I am weary.",
  "Father, let this day bring glory to Your name.",
  "Lord, teach me to rest in Your faithfulness.",
  "Father, guard my heart and my mind in Christ Jesus.",
];

/* =========================================================
   4. DAILY PICK — same verse all day, new one at midnight
   ========================================================= */
function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffled(list, seed) {
  const out = list.slice();
  const rand = mulberry32(seed);
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

// Fixed seed → the whole year's order is set once, so no verse
// repeats until the list has been exhausted.
const DAILY_ORDER = shuffled(VERSES, 20250601);

function dayNumber(date = new Date()) {
  return Math.floor(
    Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / 86400000
  );
}

const verseOfTheDay = () => DAILY_ORDER[dayNumber() % DAILY_ORDER.length];
const prayerOfTheDay = () => PRAYERS[dayNumber() % PRAYERS.length];

/* =========================================================
   5. ELEMENTS & STATE
   ========================================================= */
const $ = (s) => document.querySelector(s);
const el = {
  greeting: $("#greeting"),
  date: $("#date"),
  verse: $("#verse"),
  text: $("#verseText"),
  ref: $("#verseRef"),
  prayer: $("#prayerText"),
  another: $("#anotherBtn"),
  copy: $("#copyBtn"),
  fav: $("#favBtn"),
  savedBtn: $("#savedBtn"),
  savedCount: $("#savedCount"),
  dailyBtn: $("#dailyBtn"),
  progress: $("#progress"),
  dialog: $("#savedDialog"),
  savedList: $("#savedList"),
  closeDialog: $("#closeDialog"),
  signature: $("#signature"),
};

let current = null;
const STORAGE_KEY = "blessings.saved.v1";

/* =========================================================
   6. RENDERING
   ========================================================= */
function greetingText() {
  const h = new Date().getHours();
  const part = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  return SETTINGS.name ? `${part}, ${SETTINGS.name}` : part;
}

function dateText() {
  return new Intl.DateTimeFormat(undefined, {
    weekday: "long", month: "long", day: "numeric",
  }).format(new Date());
}

function show(verse, animate = false) {
  current = verse;
  el.text.textContent = verse.text;
  el.ref.textContent = `${verse.ref} · ${SETTINGS.translation}`;
  el.prayer.textContent = prayerOfTheDay();
  el.dailyBtn.hidden = verse !== verseOfTheDay();

  const idx = DAILY_ORDER.indexOf(verseOfTheDay()) + 1;
  el.progress.textContent = `Day ${idx} of ${VERSES.length}`;

  if (animate && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    el.verse.classList.remove("swap");
    void el.verse.offsetWidth;
    el.verse.classList.add("swap");
  }
  updateFav();
}

/* =========================================================
   7. SAVED VERSES
   ========================================================= */
function readSaved() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return Array.isArray(raw) ? raw : [];
  } catch { return []; }
}

function writeSaved(list) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch {}
}

function updateFav() {
  const saved = readSaved();
  const on = current ? saved.includes(current.ref) : false;
  el.fav.classList.toggle("is-on", on);
  el.fav.setAttribute("aria-pressed", String(on));
  el.fav.setAttribute("aria-label", on ? "Remove from saved" : "Save this verse");
  el.fav.querySelector("svg").setAttribute("fill", on ? "currentColor" : "none");
  el.savedCount.textContent = saved.length ? `(${saved.length})` : "";
}

function renderSavedList() {
  const saved = readSaved();
  el.savedList.replaceChildren();

  if (!saved.length) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = "No saved verses yet — tap the heart on any verse to keep it.";
    el.savedList.append(li);
    return;
  }

  for (const ref of saved) {
    const verse = VERSES.find((v) => v.ref === ref);
    if (!verse) continue;

    const li = document.createElement("li");
    li.className = "saved-item";

    const p = document.createElement("p");
    p.className = "saved-text";
    p.textContent = verse.text;

    const meta = document.createElement("div");
    meta.className = "saved-meta";

    const cite = document.createElement("cite");
    cite.className = "saved-ref";
    cite.textContent = verse.ref;

    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "saved-remove";
    remove.textContent = "Remove";
    remove.setAttribute("aria-label", `Remove ${verse.ref}`);
    remove.addEventListener("click", () => {
      writeSaved(readSaved().filter((r) => r !== ref));
      renderSavedList();
      updateFav();
    });

    meta.append(cite, remove);
    li.append(p, meta);
    el.savedList.append(li);
  }
}

/* =========================================================
   8. INTERACTIONS
   ========================================================= */
el.another.addEventListener("click", () => {
  if (VERSES.length < 2) return;
  let next;
  do { next = VERSES[Math.floor(Math.random() * VERSES.length)]; }
  while (next.ref === current.ref);
  show(next, true);
});

el.dailyBtn.addEventListener("click", () => show(verseOfTheDay(), true));

el.copy.addEventListener("click", async () => {
  const text = `${current.text}\n— ${current.ref} (${SETTINGS.translation})`;
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.append(ta);
    ta.select();
    try { document.execCommand("copy"); } catch {}
    ta.remove();
  }
  flash(el.copy, "Copied");
});

function flash(button, msg) {
  const original = button.innerHTML;
  button.textContent = msg;
  button.disabled = true;
  setTimeout(() => { button.innerHTML = original; button.disabled = false; }, 1400);
}

el.fav.addEventListener("click", () => {
  const saved = readSaved();
  const i = saved.indexOf(current.ref);
  if (i >= 0) saved.splice(i, 1); else saved.push(current.ref);
  writeSaved(saved);
  updateFav();
});

el.savedBtn.addEventListener("click", () => {
  renderSavedList();
  el.dialog.showModal();
});

el.closeDialog.addEventListener("click", () => el.dialog.close());
el.dialog.addEventListener("click", (e) => {
  if (e.target === el.dialog) el.dialog.close();
});

/* =========================================================
   9. BOOT
   ========================================================= */
el.greeting.textContent = greetingText();
el.date.textContent = dateText();

if (SETTINGS.signature) {
  el.signature.textContent = SETTINGS.signature;
  el.signature.hidden = false;
}

show(verseOfTheDay());

// Roll over to the new verse at midnight if left open.
let trackedDay = dayNumber();
setInterval(() => {
  const today = dayNumber();
  if (today !== trackedDay) {
    trackedDay = today;
    el.greeting.textContent = greetingText();
    el.date.textContent = dateText();
    show(verseOfTheDay(), true);
  }
}, 60000);

/* =========================================================
   10. PWA — service worker + install button
   ========================================================= */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

let installPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  installPrompt = e;

  const btn = document.createElement("button");
  btn.className = "link-btn";
  btn.id = "installBtn";
  btn.type = "button";
  btn.textContent = "Install app";
  btn.addEventListener("click", async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    await installPrompt.userChoice;
    installPrompt = null;
    btn.remove();
  });
  el.savedBtn.after(btn);
});
</script>
